<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>V.A.R.U.N.A - FORENSIC OPS DASHBOARD</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Syne:wght@700;800&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            "deep-space": "#04070d",
            "card-surface": "#070c14",
            "cyan-accent": "#4ee7ff",
            "mint-accent": "#3dffb0",
            "alert-accent": "#ff5a4e"
          },
          fontFamily: {
            mono: ["JetBrains Mono", "monospace"],
            display: ["Syne", "sans-serif"],
            sans: ["Plus Jakarta Sans", "Inter", "sans-serif"]
          },
          boxShadow: {
            "cyan-glow": "0 0 25px rgba(78, 231, 255, 0.22)",
            "mint-glow": "0 0 25px rgba(61, 255, 176, 0.22)",
            "alert-glow": "0 0 25px rgba(255, 90, 78, 0.25)",
            "glass-card": "0 10px 30px -10px rgba(0, 0, 0, 0.8), 0 0 1px 1px rgba(255, 255, 255, 0.08)"
          }
        }
      }
    }
  </script>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body, #root {
      width: 100%;
      min-height: 100%;
      background-color: #04070d;
      color: #f8fafc;
      font-family: "Plus Jakarta Sans", -apple-system, sans-serif;
      overflow-x: hidden;
    }

    ::-webkit-scrollbar {
      width: 5px;
      height: 5px;
    }
    ::-webkit-scrollbar-track {
      background: #04070d;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(78, 231, 255, 0.25);
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(78, 231, 255, 0.55);
    }

    .leaflet-container {
      background-color: #04070d !important;
      font-family: "JetBrains Mono", monospace !important;
    }

    .leaflet-tooltip-dark {
      background: rgba(7, 12, 20, 0.95) !important;
      border: 1px solid rgba(78, 231, 255, 0.45) !important;
      color: #f1f5f9 !important;
      border-radius: 6px !important;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.8) !important;
      font-size: 10px !important;
      padding: 4px 8px !important;
    }
    .leaflet-tooltip-dark:before {
      border-top-color: rgba(78, 231, 255, 0.45) !important;
    }

    .radar-sweep-anim {
      transform-origin: center;
      animation: radarSweepSpin 3.2s linear infinite;
    }

    @keyframes radarSweepSpin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .pulse-ring-anim {
      animation: pulseRing 2s cubic-bezier(0.2, 0.8, 0.2, 1) infinite;
    }

    @keyframes pulseRing {
      0% { transform: scale(0.85); opacity: 0.9; }
      50% { transform: scale(1.15); opacity: 0.3; }
      100% { transform: scale(0.85); opacity: 0.9; }
    }

    .scanline-bar {
      background: linear-gradient(90deg, transparent 0%, rgba(78, 231, 255, 0.7) 50%, transparent 100%);
      animation: scanlineMove 2s ease-in-out infinite alternate;
    }

    @keyframes scanlineMove {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }

    @media print {
      body * {
        visibility: hidden;
      }
      .print\:p-0, .print\:p-0 * {
        visibility: visible;
      }
    }
  </style>
</head>
<body class="bg-[#04070d] text-white antialiased">
  <div id="root">
    <div style="position:fixed;inset:0;background-color:#04070d;z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;">
      <div style="width:42px;height:42px;border-radius:50%;border:2px solid rgba(78,231,255,0.2);border-top-color:#4ee7ff;animation:initialSpin 0.8s linear infinite;margin-bottom:14px;"></div>
      <div style="color:#4ee7ff;font-size:11px;letter-spacing:0.2em;text-transform:uppercase;">Initializing Forensic Ops Dashboard...</div>
    </div>
    <style>
      @keyframes initialSpin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
    </style>
  </div>

  <script>
    // Optional: paste a VALID CARTO basemap key here to use CARTO tiles.
    // The previous embedded key is dead (CARTO answers it with
    // "API KEY REQUIRED" watermark tiles), so it is left EMPTY and
    // the map uses keyless OSM/Esri providers by default.
    window.CARTO_API_KEY = "";
  </script>
  <script src="services/mockData.js"></script>
  <script src="services/forensicApi.js"></script>
  <script type="text/babel" src="components/DashboardApp.jsx"></script>
</body>
</html>
