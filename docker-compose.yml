version: '3.8'

services:
  db:
    image: postgis/postgis:15-3.3
    container_name: varuna-postgis
    environment:
      POSTGRES_DB: varuna_db
      POSTGRES_USER: varuna_user
      POSTGRES_PASSWORD: varuna_secure_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7.0-alpine
    container_name: varuna-redis
    ports:
      - "6379:6379"

  api:
    build: ./backend
    container_name: varuna-api-gateway
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
      - ./ml_pipeline:/ml_pipeline
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://varuna_user:varuna_secure_password@db/varuna_db
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis

  worker:
    build: ./backend
    container_name: varuna-celery-worker
    command: celery -A app.workers.celery_app.celery_app worker --loglevel=info
    volumes:
      - ./backend:/app
      - ./ml_pipeline:/ml_pipeline
    environment:
      - DATABASE_URL=postgresql://varuna_user:varuna_secure_password@db/varuna_db
      - REDIS_URL=redis://redis:6379/0
      - PYTHONPATH=/:/app:/ml_pipeline
    depends_on:
      - db
      - redis

  frontend:
    build: ./frontend
    container_name: varuna-frontend
    command: npm run dev
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - api

volumes:
  pgdata: